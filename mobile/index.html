<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <link
        rel="manifest"
        href="/mobile/manifest.json"
    >

    <link
        rel="stylesheet"
        href="/mobile/style.css"
    >

    <title>The Watcher</title>
</head>

<body>

    <main class="watcher">

        <div class="title">
            THE WATCHER
        </div>

        <div class="entity">
            ●
        </div>

        <div
            id="message"
            class="message"
        >
            Nothing unusual.
        </div>

        <div class="divider"></div>

        <section class="device">

            <div class="section-title">
                DEVICE
            </div>

            <div class="device-name">
                <span class="status-dot"></span>
                <span id="deviceName">
                    Waiting...
                </span>
            </div>

            <div
                id="connection"
                class="connection"
            >
                Connecting...
            </div>

        </section>

        <section class="observation">

            <div class="section-title">
                LAST OBSERVATION
            </div>

            <div id="lastEvent">
                Nothing unusual.
            </div>

        </section>

        <div class="footer">
            WATCHER / 001
        </div>

    </main>

    <script src="/mobile/app.js"></script>

</body>

</html>
